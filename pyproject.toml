[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kpi-metrics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["kpi_metrics"]
