site_name: feature_kit
site_description: Composable Polars pipelines that turn daily time series into forecast features and alpha signals.
repo_url: https://github.com/choochoo0726/feature_kit
repo_name: feature_kit
edit_uri: ""

docs_dir: docs
exclude_docs: |
  superpowers/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - User guide:
      - Base features: guide/base-features.md
      - Benchmarks: guide/benchmarks.md
      - Comparisons: guide/comparisons.md
      - Transformations: guide/transformations.md
      - Builder & presets: guide/builder.md
      - Recipes: guide/recipes.md
      - Writing custom components: guide/extending.md
  - Known limitations: limitations.md
  - API reference:
      - api/index.md
      - Param & base classes: api/params.md
      - Base features: api/base_features.md
      - Benchmarks: api/benchmarks.md
      - Comparisons: api/comparisons.md
      - Transformations: api/transformations.md
      - FeatureBuilder: api/builder.md
      - Presets: api/presets.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
